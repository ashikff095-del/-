<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Akash Bot Pairing</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #080811;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    background: #11111e;
    border: 1px solid #30244d;
    border-radius: 22px;
    padding: 30px 23px;
    text-align: center;
    box-shadow: 0 0 35px #7c3aed25;
}

.logo {
    width: 75px;
    height: 75px;
    margin: auto;
    border-radius: 22px;
    background: linear-gradient(135deg, #7c3aed, #c026d3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
}

h1 {
    margin-top: 20px;
    font-size: 27px;
}

h1 span {
    color: #b47aff;
}

.subtitle {
    color: #9995a9;
    font-size: 13px;
    margin-top: 10px;
    line-height: 1.6;
}

.status {
    display: inline-block;
    margin-top: 22px;
    padding: 8px 15px;
    background: #163425;
    color: #4ade80;
    border-radius: 20px;
    font-size: 12px;
}

.form {
    margin-top: 30px;
    text-align: left;
}

label {
    display: block;
    font-size: 13px;
    margin-bottom: 10px;
    color: #d5cbe8;
}

input {
    width: 100%;
    padding: 16px;
    background: #090914;
    color: white;
    border: 1px solid #41305e;
    outline: none;
    border-radius: 12px;
    font-size: 15px;
}

input:focus {
    border-color: #a855f7;
}

button {
    width: 100%;
    margin-top: 18px;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #7c3aed, #c026d3);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

.result {
    display: none;
    margin-top: 22px;
    padding: 18px;
    background: #211634;
    border: 1px solid #7042a5;
    border-radius: 13px;
}

.result h3 {
    color: #d8b4fe;
    margin-bottom: 10px;
}

.result p {
    color: #c4b5fd;
    font-size: 13px;
    line-height: 1.6;
}

.footer {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid #30244d;
    font-size: 12px;
    color: #858095;
}

.footer span {
    color: #c084fc;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">✦</div>

    <h1>AKASH <span>PAIRING</span></h1>

    <p class="subtitle">
        Premium WhatsApp Bot Pairing Interface
        <br>
        Fast • Modern • Secure
    </p>

    <div class="status">
        ● WEBSITE ONLINE
    </div>

    <div class="form">

        <label for="phone">
            Enter Your Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter number with country code"
            autocomplete="off"
        >

        <button onclick="showDemo()">
            GENERATE DEMO
        </button>

    </div>

    <div class="result" id="result">
        <h3>Demo Interface Ready!</h3>

        <p id="message">
            This is a website preview.
        </p>

        <p style="margin-top:10px">
            No WhatsApp account has been linked.
            No pairing credentials were generated.
        </p>
    </div>

    <div class="footer">
        Created with ♥ by <span>AKASH</span>
        <br><br>
        © 2026 Akash Bot
    </div>

</div>

<script>
function showDemo() {

    const phone = document.getElementById("phone").value.trim();

    const result = document.getElementById("result");
    const message = document.getElementById("message");

    if (!/^\+?[0-9]{8,15}$/.test(phone)) {
        alert("Please enter a valid phone number.");
        return;
    }

    message.innerText =
        "Phone number accepted for this local demo: " +
        phone;

    result.style.display = "block";
}
</script>

</body>
</html>
